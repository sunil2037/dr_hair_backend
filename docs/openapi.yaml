  /api/v1/admin/media/videos/status:
    patch:
      tags: [Admin]
      summary: Publish, hide, or return a video to draft
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VideoStatusRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/support/inquiries:
    post:
      tags: [Support]
      summary: Submit a patient inquiry or consultation request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2 }
                phone: { type: string, minLength: 8 }
                email: { type: string, format: email, nullable: true }
                message: { type: string, minLength: 5 }
              required: [name, phone, message]
      responses:
        '201':
          description: Inquiry submitted successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/admin/support/inquiries:
    get:
      tags: [Admin, Support]
      summary: List patient support inquiries
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, contacted, resolved] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/support/inquiries/{id}:
    patch:
      tags: [Admin, Support]
      summary: Update support inquiry status or admin notes
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [pending, contacted, resolved] }
                admin_notes: { type: string }
              required: [status]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessEnvelope:
      type: object
      properties:
        status: { type: string, const: success }
        message: { type: string }
        data: {}
        meta: { type: object, nullable: true }
        error: { type: 'null', default: null }
        token: { type: string }
        type: { type: string }
        is_registered: { type: boolean }
        is_admin: { type: boolean }
        reference_no: { type: string }
      required: [status]
    ErrorEnvelope:
      type: object
      properties:
        status: { type: string, const: error }
        message: { type: string }
        data: { type: 'null', default: null }
        meta: { type: object, nullable: true }
        error:
          type: object
          properties:
            code: { type: string, enum: [AUTH_REQUIRED, FORBIDDEN, VALIDATION_ERROR, NOT_FOUND, CONFLICT, PROVIDER_UNAVAILABLE, PAYLOAD_TOO_LARGE, BAD_GATEWAY, INTERNAL_SERVER_ERROR] }
            message: { type: string }
            details: {}
          required: [code, message]
        details: {}
      required: [status, message]
    LoginRequest:
      type: object
      properties:
        login: { type: string, description: Indian phone number for SMS OTP }
        mobile: { type: string, description: Legacy alias for login }
        email: { type: string, description: Deprecated legacy alias; SMS OTP still requires a phone number }
      anyOf:
        - required: [login]
        - required: [mobile]
        - required: [email]
    VerifyOtpRequest:
      allOf:
        - $ref: '#/components/schemas/LoginRequest'
        - type: object
          properties:
            otp: { type: string, pattern: '^\d{6}$' }
          required: [otp]
    AdminLoginRequest:
      type: object
      properties:
        email: { type: string, minLength: 3, maxLength: 254, description: Work email or Super Admin login ID }
        password: { type: string, minLength: 1, maxLength: 256 }
      required: [email, password]
    AdminIdentity:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [admin, super_admin] }
      required: [id, email, role]
    CreateAdminAccountRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
      required: [name, email]
    RegisterUserRequest:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        age: { oneOf: [{ type: string }, { type: integer }] }
        gender: { type: string }
        city: { type: string }
        occupation: { type: string }
        platform: { type: string, default: app }
      required: [name]
      oneOf:
        - required: [email]
        - required: [phone]
    RegisterUserResponse:
      type: object
      properties:
        status: { type: boolean, const: true }
        message: { type: string }
        token: { type: string }
        refresh_token: { type: string }
        session_id: { type: string }
        is_registered: { type: boolean }
        is_admin: { type: boolean }
        data: {}
      required: [status, message, token, refresh_token, session_id, is_registered, is_admin]
    ProfileUpdateRequest:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        contact: { type: string }
        age: { oneOf: [{ type: integer, minimum: 1, maximum: 120 }, { type: 'null' }] }
        gender: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        occupation: { type: [string, 'null'] }
        platform: { type: [string, 'null'] }
        profile_url: { type: [string, 'null'], format: uri }
    UserProfile:
      type: object
      properties:
        id: { oneOf: [{ type: integer }, { type: string }] }
        patient_code: { type: string, pattern: '^DHP[0-9]{4,}$', example: DHP0001 }
        name: { type: string }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        age: { type: [integer, 'null'] }
        gender: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        occupation: { type: [string, 'null'] }
        platform: { type: [string, 'null'] }
        profile_url: { type: [string, 'null'], format: uri }
    HairTestFields:
      type: object
      properties:
        full_name: { type: string }
        name: { type: string, description: Legacy alias for full_name }
        email: { type: string, format: email }
        phone: { type: string }
        age: { type: string }
        gender: { type: string }
        city: { type: string }
        occupation: { type: string }
        hair_fall_start: { type: string }
        duration: { type: string, description: Current Flutter assessment duration answer }
        hair_fall_pattern: { type: string }
        daily_hair_fall: { type: string }
        hair_fall_increasing: { type: string }
        dandruff: { type: string }
        scalp_condition: { type: string }
        scalp_symptoms: { type: string, description: May be a JSON-encoded array }
        hair_type: { type: string }
        medical_conditions: { type: string, description: May be a JSON-encoded array }
        recent_events: { type: string, description: May be a JSON-encoded array }
        stress_level: { type: string }
        gut_health: { type: string, description: Current Flutter digestion and gut-health answer }
        gutHealth: { type: string, deprecated: true, description: Legacy camelCase alias }
        sleep_quality: { type: string }
        diet_type: { type: string }
        protein_intake: { type: string }
        family_history: { type: string }
        allergy_status: { type: string, enum: ['No known allergies', 'Yes, I have allergies', 'Not sure'], description: Optional in the API for legacy clients; collected by the current Flutter assessment. }
        allergy_details: { type: string, maxLength: 500, description: Required when allergy_status is Yes, I have allergies. }
        current_medications_status: { type: string, enum: ['No', 'Yes', 'Not sure'], description: Optional in the API for legacy clients; collected by the current Flutter assessment. }
        current_medications: { type: string, maxLength: 1000, description: Required when current_medications_status is Yes. }
        have_taken_treatment: { type: string }
        previous_treatments: { type: string, description: May be a JSON-encoded array }
        treatment_results: { type: string }
        main_concern: { type: string }
        looking_for: { type: string }
        hair_loss_stage: { type: string }
        stage: { type: string, description: Current Flutter hair-loss stage answer }
        primary_concern: { type: string, description: Current Flutter primary concern answer }
      anyOf:
        - required: [full_name]
        - required: [name]
    ReviewQueryRequest:
      type: object
      properties:
        review_type: { type: string }
        page: { type: string }
    ReviewCreateRequest:
      type: object
      properties:
        name: { type: string }
        rating: { oneOf: [{ type: string }, { type: number, minimum: 1, maximum: 5 }] }
        category: { type: string }
        message: { type: string }
        review_type: { type: string }
        page: { type: string }
      required: [name, rating, message]
    DeviceTokenRequest:
      type: object
      properties:
        token: { type: string }
        platform: { type: string, enum: [android, ios, web] }
      required: [token, platform]
    AdminTreatmentRequest:
      type: object
      properties:
        reference_no: { type: string }
        treatment_name: { type: string }
        duration: { type: string }
        instructions: { type: string }
        doctor_name: { type: string }
        medications:
          type: array
          maxItems: 25
          items: { $ref: '#/components/schemas/PrescribedMedication' }
        diagnosis: { type: string, maxLength: 500 }
        stage: { type: string, maxLength: 120 }
        next_review_date: { type: string, format: date }
        routine_steps:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/CareRoutineStep' }
        diet_meals:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/DietMealSuggestion' }
        date: { type: string, format: date }
      required: [reference_no, treatment_name]
    PrescribedMedication:
      type: object
      properties:
        catalog_id: { type: string, maxLength: 240 }
        name: { type: string, minLength: 1, maxLength: 240 }
        category: { type: string, maxLength: 240 }
        form: { type: string, maxLength: 240 }
        dose: { type: string, minLength: 1, maxLength: 240 }
        frequency: { type: string, minLength: 1, maxLength: 240 }
        duration: { type: string, maxLength: 240 }
        instructions: { type: string, maxLength: 1000 }
      required: [name, dose, frequency]
    CareRoutineStep:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        subtitle: { type: string, maxLength: 500 }
        category: { type: string, maxLength: 80 }
        time_of_day: { type: string, maxLength: 80 }
      required: [title]
    DietMealSuggestion:
      type: object
      properties:
        type: { type: string, minLength: 1, maxLength: 60 }
        name: { type: string, minLength: 1, maxLength: 160 }
        nutrients: { type: string, maxLength: 200 }
        benefit: { type: string, maxLength: 500 }
      required: [type, name]
    AdminPatientProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        age: { type: [integer, 'null'], minimum: 1, maximum: 120 }
        gender: { type: [string, 'null'], maxLength: 120 }
        city: { type: [string, 'null'], maxLength: 120 }
        occupation: { type: [string, 'null'], maxLength: 120 }
      minProperties: 1
    AdminClinicalReportUpload:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        file: { type: string, format: binary, description: PDF, JPG, PNG, or WebP; maximum 10 MB }
      required: [title, file]
    PatientProgressCheckInRequest:
      type: object
      properties:
        id: { type: string, minLength: 5, maxLength: 80, description: Client-generated idempotency key }
        date: { type: string, format: date-time }
        scalp_region: { type: string, maxLength: 100 }
        shedding_level: { type: string, maxLength: 100 }
        notes: { type: string, maxLength: 2000 }
        density_rating: { type: integer, minimum: 1, maximum: 5 }
        photos:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: '#/components/schemas/PatientProgressPhotoAsset' }
      required: [id, date, photos]
    PatientProgressPhotoAsset:
      type: object
      properties:
        angle: { type: string, enum: [front, top, back] }
        public_id: { type: string }
      required: [angle, public_id]
    AdminClinicalReportVisibilityUpdate:
      type: object
      additionalProperties: false
      properties:
        visibility: { type: string, enum: [Private, Shared] }
      required: [visibility]
    AdminReviewStatusRequest:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending, active, rejected] }
      required: [id, status]
    AdminPushRequest:
      type: object
      properties:
        user_id: { type: integer }
        title: { type: string, maxLength: 120 }
        body: { type: string, maxLength: 1000 }
        data: { type: object, additionalProperties: { type: string } }
      required: [user_id, title, body]
    VideoUploadSignatureRequest:
      type: object
      properties:
        public_id: { type: string, pattern: '^[a-zA-Z0-9_-]{1,100}$' }
    CloudinaryVideoRequest:
      type: object
      properties:
        public_id: { type: string }
        asset_id: { type: string }
        url: { type: string, format: uri }
        title: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        category: { type: string, maxLength: 80, default: Hair Care }
        placement: { type: string, enum: [home, reels, both], default: reels }
      required: [title]
      anyOf:
        - required: [public_id]
        - required: [asset_id]
        - required: [url]
    YouTubeVideoRequest:
      type: object
      properties:
        url: { type: string, format: uri }
        title: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        category: { type: string, maxLength: 80, default: Hair Care }
        placement: { type: string, enum: [home, reels, both], default: reels }
      required: [url, title]
    VideoStatusRequest:
      type: object
      properties:
        public_id: { type: string }
        status: { type: string, enum: [draft, published, hidden] }
      required: [public_id, status]
    CheckoutRequest:
      type: object
      required: [items]
      properties:
        address_id: { type: string }
        shipping_address: { $ref: '#/components/schemas/DeliveryAddressRequest' }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CheckoutItem' }
        coupon_code: { type: string }
        payment_gateway: { type: string, enum: [cod, pay_at_clinic, razorpay], default: cod }
    CheckoutItem:
      type: object
      required: [productId]
      properties:
        productId: { type: string }
        product_id: { type: string }
        quantity: { type: integer, minimum: 1, default: 1 }
        plan: { type: string, default: Standard }
    VerifyPaymentRequest:
      type: object
      required: [order_id, payment_id]
      properties:
        order_id: { type: string }
        payment_id: { type: string }
        payment_signature: { type: string }
    DeliveryAddressRequest:
      type: object
      required: [name, phone, house_number, street, city, state, pincode]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        phone: { type: string, minLength: 10, maxLength: 15 }
        house_number: { type: string, minLength: 1, maxLength: 100 }
        street: { type: string, minLength: 2, maxLength: 200 }
        city: { type: string, minLength: 2, maxLength: 100 }
        state: { type: string, minLength: 2, maxLength: 100 }
        pincode: { type: string, pattern: '^[0-9]{6}$' }
        tag: { type: string, enum: [Home, Work, Other], default: Home }
        is_default: { type: boolean, default: false }
    OrderFulfillmentRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [Preparing, Shipped, Delivered] }
        courier: { type: string, description: Required when status is Shipped }
        tracking_number: { type: string, description: Required when status is Shipped }
    AdminOrderRefundRequest:
      type: object
      properties:
        reason: { type: string }
        restock_inventory: { type: boolean, default: false }
    InventoryRestockRequest:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1 }
        note: { type: string }
  responses:
    Success:
      description: Request completed successfully
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    BadRequest:
      description: Invalid request data
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Too many requests from this IP address within the current 15-minute window
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Missing, invalid, or expired bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: The authenticated account does not have the required admin role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: The request conflicts with the resource's current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    BadGateway:
      description: Shiprocket rejected the request or returned an invalid response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServiceUnavailable:
      description: Shiprocket credentials or required account configuration are missing
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServerError:
      description: Unexpected backend error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
