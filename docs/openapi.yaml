      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/patient/appointments:
    get:
      tags: [Appointments]
      summary: List in-clinic appointments for the authenticated patient
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Patient appointments list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { type: object }
    post:
      tags: [Appointments]
      summary: Book an in-clinic appointment with consultation fee payment details
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starts_at, reason]
              properties:
                starts_at: { type: string, format: date-time, example: '2026-11-10T10:30:00+05:30' }
                reason: { type: string, example: 'Hair loss consultation & trichoscopy' }
                consultation_fee: { type: number, default: 500, example: 500 }
                payment_method: { type: string, enum: [Pay at clinic, UPI, Card, Netbanking], example: 'Pay at clinic' }
                payment_status: { type: string, enum: [Pending], default: Pending, example: Pending, description: 'Must be Pending until provider payment gateway is integrated' }
                payment_transaction_id: { type: string, nullable: true, example: null }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Slot conflict }

  /api/v1/patient/appointments/{appointmentId}:
