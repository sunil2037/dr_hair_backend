openapi: 3.1.0
info:
  title: Dr. Hair API
  version: 1.0.0
  description: >-
    Express API for the Flutter app and admin panel. MongoDB Atlas is required in
    production; only local development can fall back to in-memory repositories.
    Admin routes require a password-authenticated JWT with either the admin or super_admin role.
servers:
  - url: /
    description: Current backend origin
tags:
  - name: System
  - name: Authentication
  - name: Users
  - name: Hair tests
  - name: Treatments
  - name: Reviews
  - name: Notifications
  - name: Videos
  - name: Commerce
  - name: Admin
  - name: Media
  - name: Patient app
  - name: Support
paths:
  /api/v1/media:
    delete:
      tags: [Media]
      summary: Delete an unattached general media asset
      description: Authenticated users can delete only assets in their own general upload folder. The API rejects assets referenced by a clinical report, scalp assessment, progress check-in, or video record. Profile, report, assessment, and progress media must be removed through their resource-specific API.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                public_id: { type: string, maxLength: 240 }
                resource_type: { type: string, enum: [image, video] }
              required: [public_id, resource_type]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Media is still linked to a saved record }
        '500': { $ref: '#/components/responses/ServerError' }

  /health:
    get:
      tags: [System]
      summary: Check backend process health
      responses:
        '200':
          description: Backend process is responding
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, degraded, unavailable] }
                  database: { type: string, enum: [connected, disconnected, memory] }
                  uptime: { type: number }
                  timestamp: { type: string, format: date-time }
                required: [status, database, uptime, timestamp]
        '503':
          description: Backend is running but its production database is unavailable

  /api/v1/auth/send_login_otp:
    post:
      tags: [Authentication]
      summary: Request a sign-in or registration OTP
      description: Returns a generic response without revealing whether the identity belongs to an account. OTPs are delivered by Fast2SMS in every environment, expire after the configured period, allow up to five wrong guesses, and request limits are shared through MongoDB. The API never returns the OTP; provider failures are returned as delivery errors.
      x-legacy-path: /auth/send_login_otp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OTP request accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: OTP delivery provider is not configured for this environment }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/auth/verify_login_otp:
    post:
      tags: [Authentication]
      summary: Verify OTP and receive a bearer token
      x-legacy-path: /auth/verify_login_otp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOtpRequest' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/VerifyOtpRequest' }
      responses:
        '200':
          description: OTP verified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      token: { type: string }
                      refresh_token: { type: string }
                      session_id: { type: string }
                      is_registered: { type: boolean }
                      is_admin: { type: boolean }
                      data: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/auth/session:
    get:
      tags: [Authentication]
      summary: Validate a bearer token and return onboarding status
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Valid session and registration status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          login: { type: [string, 'null'] }
                          name: { type: [string, 'null'] }
                          is_registered: { type: boolean }
                          is_admin: { type: boolean }
                          user: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate an active refresh token and issue a fresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
                session_id: { type: string }
              required: [refresh_token, session_id]
      responses:
        '200':
          description: Token rotated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      token: { type: string }
                      refresh_token: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the active session, clear FCM token, and invalidate refresh token
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                fcm_token: { type: string }
      responses:
        '200':
          description: Signed out and session revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Retrieve authenticated patient profile and session info
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me:
    get:
      tags: [Authentication]
      summary: Alias for /api/v1/auth/me
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string }
                deviceMetadata: { type: object }
              required: [email, password]
      responses:
        '200':
          description: User signed in successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      token: { type: string }
                      refresh_token: { type: string }
                      session_id: { type: string }
                      data: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/auth/send-signup-otp:
    post:
      tags: [Authentication]
      summary: Request mobile verification OTP during account creation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string, example: "9876543210" }
              required: [phone]
      responses:
        '200':
          description: Signup OTP sent successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Phone number is already registered }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register a new patient account with email, password, and verified phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
                phone: { type: string }
                otp: { type: string, minLength: 6, maxLength: 6 }
                deviceMetadata: { type: object }
              required: [name, email, password, phone, otp]
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      token: { type: string }
                      refresh_token: { type: string }
                      session_id: { type: string }
                      data: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Email or phone already registered }

  /api/v1/auth/social-login:
    post:
      tags: [Authentication]
      summary: Sign in or register with Google or Apple
      description: Returns active session tokens if already linked/registered with a verified phone number, or requires_phone_verification with a temporary registration token if this is a first-time signup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string, enum: [google, apple] }
                providerId: { type: string }
                email: { type: string }
                name: { type: string }
                deviceMetadata: { type: object }
              required: [provider, providerId]
      responses:
        '200':
          description: Social authentication response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      requires_phone_verification: { type: boolean }
                      temp_token: { type: string }
                      token: { type: string }
                      refresh_token: { type: string }
                      data: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/auth/verify-social-signup:
    post:
      tags: [Authentication]
      summary: Complete first-time social signup by verifying mobile number with OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tempToken: { type: string }
                phone: { type: string }
                otp: { type: string }
                deviceMetadata: { type: object }
              required: [tempToken, phone, otp]
      responses:
        '201':
          description: Account created and social identity linked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      token: { type: string }
                      refresh_token: { type: string }
                      session_id: { type: string }
                      data: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Phone number already associated with another account }

  /api/v1/auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request password reset OTP to verified mobile or email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login: { type: string }
              required: [login]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset account password using verified OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login: { type: string }
                otp: { type: string }
                newPassword: { type: string, minLength: 6 }
              required: [login, otp, newPassword]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin-auth/login:
    post:
      tags: [Admin]
      summary: Sign in to the admin panel with an email or admin ID and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminLoginRequest' }
      responses:
        '200':
          description: Admin session created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token: { type: string }
                          admin: { $ref: '#/components/schemas/AdminIdentity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }


  /api/v1/users/checkUser:
    post:
      tags: [Users]
      summary: Validate the current user session
      x-legacy-path: /Admin/checkUser
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/users/loginSignup:
    post:
      tags: [Users]
      summary: Create or update a user profile after verification
      description: Requires the bearer token returned by OTP verification. The submitted email or phone must match the verified login in that token; only one login identity can be added per verification. Age, gender, city, occupation, and platform are optional.
      x-legacy-path: /Admin/loginSignup
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterUserRequest' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/RegisterUserRequest' }
      responses:
        '200':
          description: User profile created or updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterUserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/users/get_profile:
    post:
      tags: [Users]
      summary: Get the authenticated user's profile
      x-legacy-path: /Admin/get_profile
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/users/updateProfile:
    post:
      tags: [Users]
      summary: Update patient profile fields
      description: >-
        Age, gender, city, occupation, and an uploaded profile_url can be updated.
        profile_url must be a Cloudinary image uploaded with X-Media-Purpose: profile.
        Set it to null to remove the photo. A changed email or phone must first be verified;
        contact fields are not changed by ordinary profile editing.
      x-legacy-path: /Admin/updateProfile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdateRequest' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ProfileUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/users/profileUpdate:
    post:
      tags: [Users]
      summary: Upload the authenticated user's profile picture
      deprecated: true
      description: Legacy upload route. New clients should use POST /api/v1/media/upload, then save the returned URL with POST /api/v1/users/updateProfile.
      x-legacy-path: /Admin/profileUpdate
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                action: { type: string, enum: [upload, remove], example: upload }
                profile: { type: string, format: binary, description: JPEG, PNG, or WebP image }
              description: Set action to remove without a profile file to clear the patient's profile photo.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/users/deleteAccount:
    post:
      tags: [Users]
      summary: Permanently delete authenticated user account
      description: Deletes user personal authentication profile and clears active sessions and OTPs. Clinical reports and doctor treatments are preserved for medical compliance and record keeping.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Account deleted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Users]
      summary: Permanently delete authenticated user account (HTTP DELETE)
      description: Deletes user personal authentication profile and clears active sessions and OTPs. Clinical reports and doctor treatments are preserved for medical compliance and record keeping.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Account deleted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/media/upload:
    post:
      tags: [Media]
      summary: Upload one to five images or videos to Cloudinary
      description: Streams 1 to 5 mixed image/video files directly to Cloudinary, avoiding full-file buffering in the API. Registered users can upload their own media and admins can upload admin media. Assessment and progress images are stored as authenticated private assets; their returned URL is signed and expires after five minutes. Save the public_id through the resource-specific API so it can return a fresh signed URL. Each image is limited to 10 MiB and each video to MAX_MEDIA_FILE_SIZE_MB (default 100 MiB).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: X-Media-Purpose
          required: false
          schema: { type: string, enum: [general, profile, assessment, progress, content], default: general }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary, description: One JPEG, PNG, WebP, GIF, AVIF, MP4, MOV, M4V, or WebM file }
                files:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { type: string, format: binary, description: JPEG, PNG, WebP, GIF, AVIF, MP4, MOV, M4V, or WebM }
              anyOf:
                - required: [file]
                - required: [files]
      responses:
        '201':
          description: Uploaded media asset URL and metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            minItems: 1
                            maxItems: 5
                            items:
                              type: object
                              required: [asset_id, url, resource_type, bytes]
                              properties:
                                asset_id: { type: string }
                                public_id: { type: string }
                                url: { type: string, format: uri }
                                delivery_type: { type: string, enum: [upload, authenticated] }
                                purpose: { type: string, enum: [general, profile, assessment, progress, content] }
                                resource_type: { type: string, enum: [image, video] }
                                format: { type: [string, 'null'] }
                                mime_type: { type: string }
                                bytes: { type: number }
                                width: { type: [number, 'null'] }
                                height: { type: [number, 'null'] }
                                duration: { type: [number, 'null'] }
                          asset_id: { type: string }
                          public_id: { type: string }
                          url: { type: string, format: uri }
                          resource_type: { type: string, enum: [image, video] }
                          format: { type: [string, 'null'] }
                          mime_type: { type: string }
                          bytes: { type: number }
                          width: { type: [number, 'null'] }
                          height: { type: [number, 'null'] }
                          duration: { type: [number, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '413': { description: File is larger than the configured upload limit }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/hair-tests/submit_form:
    post:
      tags: [Hair tests]
      summary: Submit a hair and scalp assessment
      description: Questionnaire array fields may be JSON-encoded strings in multipart form data. For each of five scalp photo angles, send either its legacy binary field or a photo_*_url returned by POST /api/v1/media/upload with X-Media-Purpose assessment; URLs are checked against the authenticated patient before the assessment is saved.
      x-legacy-path: /HairTest/submit_form
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/HairTestFields'
                - type: object
                  properties:
                    photo_front: { type: string, format: binary, deprecated: true }
                    photo_top: { type: string, format: binary, deprecated: true }
                    photo_left: { type: string, format: binary, deprecated: true }
                    photo_right: { type: string, format: binary, deprecated: true }
                    photo_back: { type: string, format: binary, deprecated: true }
                    photo_front_url: { type: string, format: uri, description: URL returned by the shared media upload endpoint with X-Media-Purpose assessment }
                    photo_top_url: { type: string, format: uri }
                    photo_left_url: { type: string, format: uri }
                    photo_right_url: { type: string, format: uri }
                    photo_back_url: { type: string, format: uri }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/hair-tests/hair_test:
    post:
      tags: [Hair tests]
      summary: List the authenticated user's hair tests
      x-legacy-path: /HairTest/hair_test
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/treatments/get_treatment_history/{reference_no}:
    get:
      tags: [Treatments]
      summary: Get treatment history for an assessment
      x-legacy-path: /HairTest/get_treatment_history/{reference_no}
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reference_no
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/patient/clinical-record:
    get:
      tags: [Patient app]
      summary: Get the authenticated patient's assessments, care plans, and report metadata
      description: The patient identity is taken from the bearer token. It cannot be selected by a request parameter.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/patient/diet-plan:
    get:
      tags: [Patient app]
      summary: Get the authenticated patient's clinical diet plan
      description: Returns doctor-curated nutrition and meal suggestions associated with the patient's active treatment.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Patient diet plan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          treatment_name: { type: string }
                          doctor_name: { type: string }
                          diet_meals:
                            type: array
                            items:
                              type: object
                              properties:
                                type: { type: string, example: "Breakfast" }
                                name: { type: string, example: "Sprouted Moong & Boiled Eggs" }
                                nutrients: { type: string, example: "Protein 18g, Biotin 25mcg" }
                                benefit: { type: string, example: "Strengthens hair cortex and keratin synthesis." }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/patient/progress-checkins:
    get:
      tags: [Patient app]
      summary: List progress check-ins for the authenticated patient
      description: Check-ins are scoped to the verified user and include freshly signed URLs for private progress images. Each image URL expires after five minutes.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Patient app]
      summary: Save a patient progress check-in using previously uploaded media
      description: Upload one to three photos first through POST /api/v1/media/upload with X-Media-Purpose progress, then send each returned public_id with its angle. This endpoint verifies the private Cloudinary asset, owner folder, actual format, and byte count before saving it.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatientProgressCheckInRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { description: Uploaded image exceeds the configured size limit }
    delete:
      tags: [Patient app]
      summary: Delete one progress photo from the patient's check-in
      description: Removes the image reference and deletes the corresponding authenticated Cloudinary asset. If storage deletion fails, the database reference is restored.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: checkInId
          in: path
          required: true
          schema: { type: string }
        - name: angle
          in: path
          required: true
          schema: { type: string, enum: [front, top, back] }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Cloudinary deletion failed; the image reference was restored }

