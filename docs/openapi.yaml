    get:
      tags: [Admin]
      summary: List a patient's reports in the 30-day recovery archive
      description: Super Admin only. Reports past purge_after have already been permanently removed and are not returned.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, description: Numeric database ID or patient code such as DHP0001 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

